name: Distroless scan - OpenBao

on:
  workflow_dispatch:
  schedule:
  - cron: '00 4 * * 1-5'

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: openbao/cpar.dev/images/%VERSION%/enterprise-distroless.yaml
      version-dir: openbao/ghcr.io (deprecated)/images
      minor-count: '3'
      ignore-prefix: openbao
      alert: OpenBao Enterprise Distroless
    secrets:
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}
