name: Update images

on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Distribution product'
        required: true
        type: choice
        default: fluxcd
        options:
          - fluxcd
          - openbao
      version:
        description: 'Product version (empty = VERSION file, all = backfill every pinned version)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_READONLY }}
      - name: Login to ControlPlane Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: cpar.dev
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Flux
        if: inputs.product == 'fluxcd' && inputs.version != '' && inputs.version != 'all'
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5
        with:
          version: ${{ inputs.version }}
      - name: Setup Flux (latest)
        if: inputs.product == 'fluxcd' && (inputs.version == '' || inputs.version == 'all')
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5
      - name: Resolve version
        id: version
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION:-$(cat "${PRODUCT}/ghcr.io/images/VERSION")}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Update image pins
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
        run: .github/workflows/update-images.sh
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Update ${{ inputs.product }} images for ${{ steps.version.outputs.version }}
          committer: GitHub <noreply@github.com>
          signoff: true
          branch: update-images-${{ inputs.product }}-${{ steps.version.outputs.version }}
          title: Update ${{ inputs.product }} images for ${{ steps.version.outputs.version }}
          body: |
            Update `${{ inputs.product }}` image digests for
            `${{ steps.version.outputs.version }}` in both `ghcr.io` and `cpar.dev`.
          labels: |
            area/images
