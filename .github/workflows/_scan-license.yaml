# Reusable license scan for a distribution's upstream Go module.
on:
  workflow_call:
    inputs:
      product:
        description: 'product name, used in job names'
        required: true
        type: string
      repository:
        description: 'upstream repository, e.g. openbao/openbao'
        required: true
        type: string
      version-file:
        description: 'file containing the product version (e.g. fluxcd/ghcr.io (deprecated)/images/VERSION)'
        required: false
        type: string
        default: ''
      version-dir:
        description: 'directory containing version dirs; used when version-file is absent'
        required: false
        type: string
        default: ''
      version:
        description: 'scan only this exact version (empty = use minor-count selection)'
        required: false
        type: string
        default: ''
      minor-count:
        description: 'number of latest minor versions to scan (0 = latest only)'
        required: false
        type: string
        default: '3'
      license-confidence-level:
        description: 'minimum Trivy license classifier confidence for the gate'
        required: false
        type: string
        default: '0.9'
      alert:
        description: 'Zulip alert prefix'
        required: false
        type: string
        default: 'Distribution'
    secrets:
      ZULIP_EMAIL:
        required: false
      ZULIP_API_KEY:
        required: false
      ZULIP_ORGANIZATION_URL:
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.find.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve versions
        id: find
        shell: bash
        env:
          VERSION_FILE: ${{ inputs.version-file }}
          VERSION_DIR: ${{ inputs.version-dir }}
          ONLY_VERSION: ${{ inputs.version }}
          MINOR_COUNT: ${{ inputs.minor-count }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_DIR" ]; then
            dir="$VERSION_DIR"
          elif [ -n "$VERSION_FILE" ]; then
            dir="$(dirname "$VERSION_FILE")"
          else
            echo "one of version-file or version-dir is required" >&2
            exit 1
          fi

          all_versions="$(find "$dir" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)"
          [ -n "$all_versions" ] || { echo "no versions under $dir" >&2; exit 1; }

          count="${MINOR_COUNT:-3}"
          if [ -n "$ONLY_VERSION" ]; then
            selected="$ONLY_VERSION"
          elif [ "$count" -le 0 ]; then
            if [ -n "$VERSION_FILE" ]; then
              selected="$(cat "$VERSION_FILE")"
            else
              selected="$(printf '%s\n' "$all_versions" | tail -n1)"
            fi
          else
            minors="$(printf '%s\n' "$all_versions" | sed 's/^v//' \
              | cut -d. -f1,2 | sort -Vu | tail -n "$count")"
            selected=""
            for minor in $minors; do
              version="$(printf '%s\n' "$all_versions" \
                | grep -E "^v${minor//./\\.}\." | sort -V | tail -n1 || true)"
              [ -n "$version" ] && selected="${selected}${version}"$'\n'
            done
          fi
          [ -n "$selected" ] || { echo "no matching versions under $dir" >&2; exit 1; }

          selected_versions="$(printf '%s\n' "$selected" | sed '/^$/d' | sort -Vr)"
          selected_minors="$(printf '%s\n' "$selected_versions" | sed 's/^v//' \
            | cut -d. -f1,2 | sort -Vr)"

          targets="[]"
          for version in $selected_versions; do
            minor="$(echo "${version#v}" | cut -d. -f1,2)"
            rank="$(printf '%s\n' "$selected_minors" \
              | awk -v m="$minor" '$0 == m { print NR; exit }')"
            case "$rank" in
              1) label="" ;;
              *) label="N-$((rank - 1))" ;;
            esac
            targets="$(jq -c --arg v "$version" --arg l "$label" \
              '. + [{version: $v, label: $l}]' <<<"$targets")"
          done
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          echo "$targets" | jq .

  license:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    name: ${{ inputs.product }} ${{ matrix.target.version }}${{ matrix.target.label != '' && format(' ({0})', matrix.target.label) || '' }}
    steps:
      - name: Checkout ${{ inputs.product }} ${{ matrix.target.version }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ matrix.target.version }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Download Go dependencies
        run: go mod download
      - name: Setup Trivy
        run: |
          sudo apt-get install wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy
      - name: License report
        run: |
          trivy fs -q --format table --scanners license --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL ./go.mod
      - name: License check
        run: |
          trivy fs -q --format table --scanners license \
            --license-confidence-level "${{ inputs.license-confidence-level }}" \
            --severity UNKNOWN,HIGH,CRITICAL ./go.mod --exit-code 1

  notify-zulip:
    needs: license
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Build message
        id: message
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT: ${{ inputs.alert }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPO}/actions/runs/${GITHUB_RUN_ID}"
          failed="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPO" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | .name' | sed 's/^/- /')"
          [ -n "$failed" ] || failed="- license scan failed"
          {
            echo "content<<EOF"
            echo "${ALERT} license scan failed"
            echo
            echo "$failed"
            echo
            echo "Run: ${url}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: zulip/github-actions-zulip/send-message@f675f2b4eb2a95fae974215476dcb7ad8dfeff6b # v2.0.2
        with:
          email: ${{ secrets.ZULIP_EMAIL }}
          api-key: ${{ secrets.ZULIP_API_KEY }}
          organization-url: ${{ secrets.ZULIP_ORGANIZATION_URL }}
          type: stream
          to: Distribution
          topic: license-alerts
          content: ${{ steps.message.outputs.content }}
