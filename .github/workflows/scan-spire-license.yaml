name: License scan - SPIRE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Scan only this version (empty = latest)'
        required: false
        type: string
  schedule:
  - cron: '00 6 * * 1-5'
  push:
    branches:
      - 'license-*'

permissions:
  contents: read

jobs:
  license:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_scan-license.yaml
    with:
      product: SPIRE
      repository: spiffe/spire
      version-file: spire/ghcr.io/images/VERSION
      version: ${{ inputs.version }}
      minor-count: '1'
      alert: SPIRE License
    secrets:
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}
