name: Update pins

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Update target'
        required: true
        type: choice
        default: fluxcd
        options:
          - fluxcd
          - openbao
          - dex
          - spire
          - flux-mcp-enterprise
      version:
        description: 'Image version (empty = VERSION file / latest pin, all = every pinned version)'
        required: false
        type: string
      chart_version:
        description: 'Chart version (empty = latest / matching, all = every pinned chart, skip = images only)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      entries: ${{ steps.find.outputs.entries }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve target versions
        id: find
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            fluxcd) images_dir="fluxcd/ghcr.io (deprecated)/images" ;;
            openbao) images_dir="openbao/ghcr.io (deprecated)/images" ;;
            dex) images_dir="dex/ghcr.io (deprecated)/images" ;;
            spire) images_dir="spire/cpar.dev/images" ;;
            flux-mcp-enterprise) images_dir="fluxcd/ghcr.io (deprecated)/addons/flux-mcp-enterprise/images" ;;
            *) echo "unknown target: $TARGET" >&2; exit 1 ;;
          esac

          if [ "$VERSION" = "all" ]; then
            versions="$(find "$images_dir" -mindepth 1 -maxdepth 1 \
              -type d -name 'v*' -printf '%f\n' | sort -V)"
          elif [ -z "$VERSION" ]; then
            if [ -f "${images_dir}/VERSION" ]; then
              versions="$(cat "${images_dir}/VERSION")"
            else
              versions="$(ls "$images_dir" | grep -E '^v[0-9]' | sort -V | tail -n1)"
            fi
          else
            versions="$VERSION"
          fi
          [ -n "$versions" ] || { echo "no versions found under $images_dir" >&2; exit 1; }

          latest="$(printf '%s\n' "$versions" | sort -V | tail -n1)"
          entries="[]"
          for v in $versions; do
            chart="skip"
            case "$TARGET" in
              flux-mcp-enterprise)
                if [ -z "$CHART_VERSION" ] || [ "$CHART_VERSION" = "all" ]; then
                  # Chart versions match image versions without the v prefix.
                  chart="${v#v}"
                elif [ "$VERSION" = "all" ] && [ "$v" != "$latest" ]; then
                  chart="skip"
                else
                  chart="$CHART_VERSION"
                fi
                ;;
              dex)
                if [ "$v" = "$latest" ]; then
                  chart="$CHART_VERSION"
                fi
                ;;
              spire)
                if [ "$v" = "$latest" ]; then
                  case "$CHART_VERSION" in
                    skip) chart="skip" ;;
                    ''|all) chart="" ;;
                    *) chart="$CHART_VERSION" ;;
                  esac
                fi
                ;;
            esac
            entries="$(jq -c --arg v "$v" --arg c "$chart" \
              '. + [{version: $v, chart_version: $c}]' <<<"$entries")"
          done
          echo "entries=${entries}" >> "$GITHUB_OUTPUT"
          echo "$entries" | jq .

  generate:
    needs: discover
    if: needs.discover.outputs.entries != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.entries) }}
    name: ${{ inputs.target }} ${{ matrix.entry.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_READONLY }}
      - name: Helm login to GitHub Container Registry
        shell: bash
        env:
          GHCR_READONLY: ${{ secrets.GHCR_READONLY }}
        run: echo "$GHCR_READONLY" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Login to ControlPlane Artifact Registry
        uses: ./.github/actions/cpar-login
      - name: Setup Flux
        if: inputs.target == 'fluxcd'
        uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: ${{ matrix.entry.version }}
      - name: Update pins
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ matrix.entry.version }}
          CHART_VERSION: ${{ matrix.entry.chart_version }}
        run: .github/workflows/update-pins.sh
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Update ${{ inputs.target }} ${{ matrix.entry.version }} pins
          committer: GitHub <noreply@github.com>
          signoff: true
          branch: update-${{ inputs.target }}-${{ matrix.entry.version }}
          title: Update ${{ inputs.target }} ${{ matrix.entry.version }} pins
          body: |
            Refresh image and chart pins for `${{ inputs.target }}`
            `${{ matrix.entry.version }}` ${{ inputs.target == 'spire' && 'in `cpar.dev`.' || 'in both `ghcr.io` and `cpar.dev`.' }}
          labels: |
            area/updates
