name: Scan - Dex

on:
  workflow_dispatch:
    inputs:
      scan:
        description: 'What to scan'
        required: true
        type: choice
        default: all
        options:
          - all
          - product
          - license
      version:
        description: 'Scan only this version (empty = last 3 minor versions)'
        required: false
        type: string
  schedule:
  - cron: '00 4 * * 1-5'
  push:
    branches:
      - 'license-*'

permissions:
  contents: read

jobs:
  vulnerability:
    if: github.event_name != 'push' && (inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'product')
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: >-
        dex/ghcr.io/images/%VERSION%/enterprise-distroless-fips.yaml
        dex/cpar.dev/images/%VERSION%/enterprise-distroless-fips.yaml
      version-file: dex/ghcr.io/images/VERSION
      version: ${{ inputs.version }}
      minor-count: '3'
      ignore-prefix: dex
      alert: Dex Enterprise
    secrets:
      pull-token: ${{ secrets.GHCR_READONLY }}
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}

  license:
    if: github.event_name == 'push' || inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'license'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_scan-license.yaml
    with:
      product: Dex
      repository: dexidp/dex
      version-file: dex/ghcr.io/images/VERSION
      version: ${{ inputs.version }}
      minor-count: '3'
      alert: Dex License
    secrets:
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}
