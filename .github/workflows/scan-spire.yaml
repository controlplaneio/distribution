name: Scan - SPIRE

on:
  workflow_dispatch:
    inputs:
      scan:
        description: 'What to scan'
        required: true
        type: choice
        default: all
        options:
          - all
          - product
      version:
        description: 'Scan only this version (empty = last 3 minor versions)'
        required: false
        type: string
  schedule:
  - cron: '00 4 * * 1-5'

permissions:
  contents: read

jobs:
  distroless:
    if: github.event_name != 'push' && (inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'product')
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: >-
        spire/cpar.dev/images/%VERSION%/enterprise-distroless-fips.yaml
      version-dir: spire/cpar.dev/images
      version: ${{ inputs.version }}
      minor-count: '3'
      exclude-latest: true
      ignore-prefix: spire
      alert: SPIRE Enterprise Distroless (previous)
    secrets:
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}
