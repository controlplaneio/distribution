name: Vulnerability scan - Flux Distroless Previous Versions

on:
  workflow_dispatch:
  schedule:
  - cron: '00 4 * * 1-5'

jobs:
  scan-1:
    permissions:
      contents: read
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: >-
        fluxcd/ghcr.io/images/%VERSION%/enterprise-distroless.yaml
        fluxcd/cpar.dev/images/%VERSION%/enterprise-distroless.yaml
      version-file: fluxcd/ghcr.io/images/VERSION
      minor-version-offset: '1'
      ignore-prefix: fluxcd
      alert: Flux Enterprise Distroless (N-1)
    secrets:
      pull-token: ${{ secrets.GHCR_READONLY }}
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}

  scan-2:
    permissions:
      contents: read
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: >-
        fluxcd/ghcr.io/images/%VERSION%/enterprise-distroless.yaml
        fluxcd/cpar.dev/images/%VERSION%/enterprise-distroless.yaml
      version-file: fluxcd/ghcr.io/images/VERSION
      minor-version-offset: '2'
      ignore-prefix: fluxcd
      alert: Flux Enterprise Distroless (N-2)
    secrets:
      pull-token: ${{ secrets.GHCR_READONLY }}
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}
