name: Distroless scan - Flux

on:
  workflow_dispatch:
  schedule:
  - cron: '00 4 * * 1-5'

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: fluxcd/cpar.dev/images/%VERSION%/enterprise-distroless.yaml
      version-file: fluxcd/ghcr.io (deprecated)/images/VERSION
      minor-count: '1'
      ignore-prefix: fluxcd
      alert: Flux Enterprise Distroless
    secrets:
      pull-token: ${{ secrets.GHCR_READONLY }}
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}
