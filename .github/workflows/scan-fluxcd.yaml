name: Scan - Flux

on:
  workflow_dispatch:
    inputs:
      scan:
        description: 'What to scan'
        required: true
        type: choice
        default: all
        options:
          - all
          - product
          - addons
          - upstream
          - operator
          - license
      version:
        description: 'Scan only this version (empty = last 3 minor versions)'
        required: false
        type: string
  schedule:
  - cron: '00 4 * * 1-5'
  push:
    branches:
      - 'license-*'

permissions:
  contents: read

jobs:
  vulnerability:
    if: github.event_name != 'push' && (inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'product')
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: >-
        fluxcd/cpar.dev/images/%VERSION%/enterprise-alpine.yaml
        fluxcd/cpar.dev/images/%VERSION%/enterprise-distroless.yaml
      version-file: fluxcd/ghcr.io/images/VERSION
      version: ${{ inputs.version }}
      minor-count: '3'
      ignore-prefix: fluxcd
      alert: Flux Enterprise
    secrets:
      pull-token: ${{ secrets.GHCR_READONLY }}
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}

  addons:
    if: github.event_name != 'push' && (inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'addons')
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: >-
        fluxcd/cpar.dev/addons/flux-mcp-enterprise/images/%VERSION%/enterprise-*.yaml
      version-dir: fluxcd/ghcr.io/addons/flux-mcp-enterprise/images
      version: ${{ inputs.version }}
      minor-count: '3'
      ignore-prefix: fluxcd
      release-ignore: false
      alert: Flux MCP Enterprise
    secrets:
      pull-token: ${{ secrets.GHCR_READONLY }}
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}

  upstream:
    if: github.event_name != 'push' && (inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'upstream')
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      version-file: fluxcd/ghcr.io/images/VERSION
      version: ${{ inputs.version }}
      minor-count: '3'
      ignore-prefix: fluxcd
      check-scan-error: false
      alert: Flux Upstream
    secrets:
      pull-token: ${{ secrets.GHCR_READONLY }}
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}

  operator:
    if: github.event_name != 'push' && (inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'operator')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - name: Latest release
      id: release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=$(gh release view --repo controlplaneio-fluxcd/flux-operator --json tagName -q .tagName)
        echo version=${VERSION} >> $GITHUB_OUTPUT
    - name: Export image
      id: image
      run: echo fo=${REGISTRY}:${VERSION} >> $GITHUB_OUTPUT
      env:
        REGISTRY: ghcr.io/controlplaneio-fluxcd/flux-operator
        VERSION: ${{ steps.release.outputs.version }}
    - name: Scan flux-operator
      id: fo
      continue-on-error: true
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        cache: true
        image-ref: ${{ steps.image.outputs.fo }}
        format: table
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: os,library
        severity: CRITICAL,HIGH,MEDIUM
    - name: Scan result
      env:
        OUTCOME: ${{ steps.fo.outcome }}
        IMAGE: ${{ steps.image.outputs.fo }}
      run: |
        echo "flux-operator: ${OUTCOME}"
        echo "image: ${IMAGE}"
    - name: Get Job URL
      if: steps.fo.outcome == 'failure'
      id: job-url
      run: |
        url=$(gh run view ${GITHUB_RUN_ID} --repo ${GITHUB_REPO} --json jobs --jq ".jobs[0].url")
        echo "url: $url"
        echo url=$url >> $GITHUB_OUTPUT
      env:
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: zulip/github-actions-zulip/send-message@f675f2b4eb2a95fae974215476dcb7ad8dfeff6b # v2.0.2
      if: steps.fo.outcome == 'failure'
      with:
        email: ${{ secrets.ZULIP_EMAIL }}
        api-key: ${{ secrets.ZULIP_API_KEY }}
        organization-url: ${{ secrets.ZULIP_ORGANIZATION_URL }}
        type: stream
        to: Distribution
        topic: cve-alerts
        content: 'Flux Operator CVE alert (not part of CP SLA): ${{ steps.job-url.outputs.url }}'
    - name: Check result
      shell: bash
      if: steps.fo.outcome == 'failure'
      run: |
        echo "Operator has vulnerabilities"
        exit 1

  license:
    if: github.event_name == 'push' || inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'license'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_scan-license.yaml
    with:
      product: Flux
      repository: fluxcd/flux2
      version-file: fluxcd/ghcr.io/images/VERSION
      version: ${{ inputs.version }}
      minor-count: '3'
      alert: Flux License
    secrets:
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}
