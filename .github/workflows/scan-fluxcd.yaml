name: Scan - Flux

on:
  workflow_dispatch:
    inputs:
      scan:
        description: 'What to scan'
        required: true
        type: choice
        default: all
        options:
          - all
          - product
          - addons
          - upstream
          - operator
      version:
        description: 'Scan only this version (empty = last 3 minor versions)'
        required: false
        type: string
  schedule:
  - cron: '00 4 * * 1-5'

permissions:
  contents: read

jobs:
  vulnerability:
    if: github.event_name != 'push' && (inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'product')
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: >-
        fluxcd/cpar.dev/images/%VERSION%/enterprise-alpine.yaml
      version-dir: fluxcd/ghcr.io (deprecated)/images
      version: ${{ inputs.version }}
      minor-count: '3'
      ignore-prefix: fluxcd
      alert: Flux Enterprise
      notify: false
    secrets:
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}

  distroless:
    if: github.event_name != 'push' && (inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'product')
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: >-
        fluxcd/cpar.dev/images/%VERSION%/enterprise-distroless.yaml
      version-dir: fluxcd/ghcr.io (deprecated)/images
      version: ${{ inputs.version }}
      minor-count: '3'
      exclude-latest: true
      ignore-prefix: fluxcd
      alert: Flux Enterprise Distroless (previous)
      notify: false
    secrets:
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}

  addons:
    if: github.event_name != 'push' && (inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'addons')
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: >-
        fluxcd/cpar.dev/addons/flux-mcp-enterprise/images/%VERSION%/enterprise-*.yaml
      version-dir: fluxcd/ghcr.io (deprecated)/addons/flux-mcp-enterprise/images
      version: ${{ inputs.version }}
      minor-count: '1'
      ignore-prefix: fluxcd
      release-ignore: false
      alert: Flux MCP Enterprise
      notify: false
    secrets:
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}

  upstream:
    if: github.event_name != 'push' && (inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'upstream')
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: fluxcd/ghcr.io (deprecated)/images/%VERSION%/upstream-alpine.yaml
      version-dir: fluxcd/ghcr.io (deprecated)/images
      version: ${{ inputs.version }}
      minor-count: '1'
      ignore-prefix: fluxcd
      check-scan-error: false
      alert: Flux Upstream
      notify: false
    secrets:
      pull-token: ${{ secrets.GITHUB_TOKEN }}
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}

  operator:
    if: github.event_name != 'push' && (inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'operator')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - name: Latest release
      id: release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=$(gh release view --repo controlplaneio-fluxcd/flux-operator --json tagName -q .tagName)
        echo version=${VERSION} >> $GITHUB_OUTPUT
    - name: Export image
      id: image
      run: echo fo=${REGISTRY}:${VERSION} >> $GITHUB_OUTPUT
      env:
        REGISTRY: ghcr.io/controlplaneio-fluxcd/flux-operator
        VERSION: ${{ steps.release.outputs.version }}
    - name: Scan flux-operator
      id: fo
      continue-on-error: true
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        cache: true
        image-ref: ${{ steps.image.outputs.fo }}
        format: table
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: os,library
        severity: CRITICAL,HIGH,MEDIUM
    - name: Scan result
      env:
        OUTCOME: ${{ steps.fo.outcome }}
        IMAGE: ${{ steps.image.outputs.fo }}
      run: |
        echo "flux-operator: ${OUTCOME}"
        echo "image: ${IMAGE}"
    - name: Check result
      shell: bash
      if: steps.fo.outcome == 'failure'
      run: |
        echo "Operator has vulnerabilities"
        exit 1

  notify-zulip:
    needs:
      - vulnerability
      - distroless
      - addons
      - upstream
      - operator
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Build message
        id: message
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPO}/actions/runs/${GITHUB_RUN_ID}"
          failed="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPO" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | .name' | sed 's/^/- /')"
          [ -n "$failed" ] || failed="- scan job failed"
          {
            echo "content<<EOF"
            echo "Flux Enterprise CVE scan failed"
            echo
            echo "$failed"
            if grep -qx -- '- operator' <<<"$failed"; then
              echo
              echo "Flux Operator CVE alert (not part of CP SLA)"
            fi
            echo
            echo "Run: ${url}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: zulip/github-actions-zulip/send-message@f675f2b4eb2a95fae974215476dcb7ad8dfeff6b # v2.0.2
        with:
          email: ${{ secrets.ZULIP_EMAIL }}
          api-key: ${{ secrets.ZULIP_API_KEY }}
          organization-url: ${{ secrets.ZULIP_ORGANIZATION_URL }}
          type: stream
          to: Distribution
          topic: cve-alerts
          content: ${{ steps.message.outputs.content }}
