# Vulnerability scan of the published Flux CD addon images.
#
# Discovers the latest image version for every addon under
# fluxcd/ghcr.io/addons/ and scans the pins from both registries.
name: Vulnerability scan - Flux Addons

on:
  workflow_dispatch:
    inputs:
      addon:
        description: 'filter: addon name'
        required: true
        type: choice
        default: all
        options:
          - mcp
          - all
  schedule:
    - cron: '00 5 * * 1-5'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pins: ${{ steps.find.outputs.pins }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find latest addon pins
        id: find
        shell: bash
        env:
          FILTER_ADDON: ${{ inputs.addon }}
        run: |
          set -euo pipefail
          [ "${FILTER_ADDON:-all}" = "all" ] && FILTER_ADDON=""
          pins=""
          for dir in fluxcd/ghcr.io/addons/*/; do
            [ -d "$dir" ] || continue
            addon="$(basename "$dir")"
            [ -n "$FILTER_ADDON" ] && [ "$addon" != "$FILTER_ADDON" ] && continue
            latest="$(ls "${dir}images" | sort -V | tail -n1)"
            for file in "${dir}images/${latest}"/enterprise*.yaml; do
              [ -f "$file" ] && pins="${pins} ${file}"
            done
            cpar_dir="fluxcd/cpar.dev/addons/${addon}/images/${latest}"
            if [ -d "$cpar_dir" ]; then
              for file in "${cpar_dir}"/enterprise*.yaml; do
                [ -f "$file" ] && pins="${pins} ${file}"
              done
            fi
          done
          echo "pins=${pins}" >> "$GITHUB_OUTPUT"
          echo "${pins}"

  scan:
    needs: discover
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: ${{ needs.discover.outputs.pins }}
      ignore-prefix: fluxcd
      release-ignore: false
      alert: Flux Enterprise Addons
    secrets:
      pull-token: ${{ secrets.GHCR_READONLY }}
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}
