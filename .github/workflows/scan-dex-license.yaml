name: License scan - Dex

on:
  workflow_dispatch:
  schedule:
    - cron: '00 6 * * 1'
  push:
    branches:
      - 'license-*'

permissions:
  contents: read

jobs:
  license:
    permissions:
      contents: read
    uses: ./.github/workflows/_scan-license.yaml
    with:
      product: Dex
      repository: dexidp/dex
      version-file: dex/ghcr.io/images/VERSION
      minor-count: '3'
