name: License scan - Dex

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Scan only this version (empty = latest minor)'
        required: false
        type: string
  schedule:
    - cron: '00 6 * * 1-5'
  push:
    branches:
      - 'license-*'

permissions:
  contents: read

jobs:
  license:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_scan-license.yaml
    with:
      product: Dex
      repository: dexidp/dex
      version-file: dex/ghcr.io/images/VERSION
      version: ${{ inputs.version }}
      minor-count: '1'
      alert: Dex License
    secrets:
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}
