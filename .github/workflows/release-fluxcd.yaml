name: Release Flux

on:
  push:
    tags:
      - 'fluxcd-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#fluxcd-}"
          minor="${version%.*}"
          notes="See the [distribution release notes](https://github.com/${GITHUB_REPOSITORY}/blob/main/fluxcd/releases/release-${minor}.md) for more details."
          gh release create "$TAG" \
            --title "Flux ${version}" \
            --notes "$notes" \
            --verify-tag
