name: Scan - OpenBao

on:
  workflow_dispatch:
    inputs:
      scan:
        description: 'What to scan'
        required: true
        type: choice
        default: all
        options:
          - all
          - product
      version:
        description: 'Scan only this version (empty = last 3 minor versions)'
        required: false
        type: string
  schedule:
  - cron: '00 4 * * 1-5'

permissions:
  contents: read

jobs:
  vulnerability:
    if: github.event_name != 'push' && (inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'product')
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: >-
        openbao/cpar.dev/images/%VERSION%/enterprise-ubi.yaml
      version-file: openbao/ghcr.io/images/VERSION
      version: ${{ inputs.version }}
      minor-count: '3'
      ignore-prefix: openbao
      alert: OpenBao Enterprise
    secrets:
      pull-token: ${{ secrets.GHCR_READONLY }}
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}
