name: Scan - OpenBao

on:
  workflow_dispatch:
    inputs:
      scan:
        description: 'What to scan'
        required: true
        type: choice
        default: all
        options:
          - all
          - product
          - license
      version:
        description: 'Scan only this version (empty = last 3 minor versions)'
        required: false
        type: string
  schedule:
  - cron: '00 4 * * 1-5'
  push:
    branches:
      - 'license-*'

permissions:
  contents: read

jobs:
  vulnerability:
    if: github.event_name != 'push' && (inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'product')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: >-
        openbao/ghcr.io/images/%VERSION%/enterprise-ubi.yaml
        openbao/ghcr.io/images/%VERSION%/enterprise-distroless.yaml
        openbao/cpar.dev/images/%VERSION%/enterprise-ubi.yaml
        openbao/cpar.dev/images/%VERSION%/enterprise-distroless.yaml
      version-file: openbao/ghcr.io/images/VERSION
      version: ${{ inputs.version }}
      minor-count: '3'
      ignore-prefix: openbao
      alert: OpenBao Enterprise
    secrets:
      pull-token: ${{ secrets.GHCR_READONLY }}
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}

  license:
    if: github.event_name == 'push' || inputs.scan == '' || inputs.scan == 'all' || inputs.scan == 'license'
    permissions:
      contents: read
    uses: ./.github/workflows/_scan-license.yaml
    with:
      product: OpenBao
      repository: openbao/openbao
      version-file: openbao/ghcr.io/images/VERSION
      version: ${{ inputs.version }}
      minor-count: '3'
      # github.com/hashicorp/vic ships an aggregate open_source_licenses
      # notice; Trivy attributes every bundled license in it to the module
      # at <1.0 confidence. Gate only exact classifier matches so those
      # false positives don't fail the check.
      license-confidence-level: '1.0'
