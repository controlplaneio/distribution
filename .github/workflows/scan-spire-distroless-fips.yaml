name: Distroless FIPS scan - SPIRE

on:
  workflow_dispatch:
  schedule:
  - cron: '00 4 * * 1-5'

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_scan-pins.yaml
    with:
      pins: spire/cpar.dev/images/%VERSION%/enterprise-distroless-fips.yaml
      version-file: spire/cpar.dev/images/VERSION
      minor-count: '1'
      ignore-prefix: spire
      alert: SPIRE Enterprise Distroless FIPS
    secrets:
      pull-token: ${{ secrets.GHCR_READONLY }}
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_ORGANIZATION_URL: ${{ secrets.ZULIP_ORGANIZATION_URL }}
